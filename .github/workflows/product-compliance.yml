name: Product compliance

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - LICENSE.txt
      - NOTICE.txt
      - PRODUCT-NOTICE.md
      - docs/product-compliance.md
      - scripts/verify-product-compliance.sh
      - server/**
  push:
    branches:
      - codex/product-compliance-draft

permissions:
  contents: read

jobs:
  product-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache-dependency-path: |
            server/go.sum
            server/public/go.sum

      - name: Verify product boundary
        run: scripts/verify-product-compliance.sh
